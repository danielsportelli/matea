<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consulenza trucco — Matéa</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F8F7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --warm-white:#F8F7F4;
    --beige:#E8DFD2;
    --taupe:#B9AA9B;
    --charcoal:#2B2B2B;
    --sage:#8A9B8C;
    --gold:#C9B37E;
    --tint-sage:#EEF1EA;
    /* safe area generose: iPhone (notch / dynamic island / home bar) e Android (gesture bar) */
    --safe-top:calc(env(safe-area-inset-top, 0px) + 22px);
    --safe-bottom:calc(env(safe-area-inset-bottom, 0px) + 30px);
    --safe-x:max(22px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--warm-white); color:var(--charcoal);
    font-family:'Manrope', sans-serif; font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh;
  }
  h1,h2,h3{ font-family:'Cormorant Garamond', serif; font-weight:400; letter-spacing:0.01em; }
  .app{ max-width:560px; margin:0 auto; }

  /* header */
  .top{
    position:sticky; top:0; z-index:20; background:rgba(248,247,244,.96);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    padding:var(--safe-top) var(--safe-x) 12px; border-bottom:1px solid var(--beige);
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; min-height:44px; }
  .logo{ font-family:'Cormorant Garamond', serif; font-size:22px; letter-spacing:.24em; font-weight:500; }
  .linkbtn{ background:none; border:0; font:inherit; font-size:14px; font-weight:600; color:var(--charcoal); padding:10px 0; min-height:44px; cursor:pointer; }
  .progress{ height:2px; background:var(--beige); margin-top:8px; }
  .progress i{ display:block; height:100%; background:var(--gold); transition:width .3s; }
  .stepper{ display:flex; align-items:center; margin-top:10px; }
  .stepper .bar{ flex:1; height:1px; background:var(--beige); min-width:4px; }
  .dot{ flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--taupe); background:#fff; color:var(--charcoal); font:600 14px 'Manrope',sans-serif; cursor:pointer; padding:0; }
  .dot.done{ background:var(--tint-sage); border-color:var(--sage); }
  .dot.cur{ background:var(--charcoal); border-color:var(--charcoal); color:#fff; }
  .steplabel{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--sage); font-weight:600; margin-top:10px; }

  main{ padding:30px var(--safe-x) 190px; }
  h1{ font-size:clamp(32px,9vw,40px); line-height:1.12; margin-bottom:10px; }
  h2{ font-size:26px; margin:34px 0 12px; line-height:1.2; }
  h3{ font-size:20px; margin-bottom:6px; }
  .lead{ color:#5b5b5b; margin-bottom:26px; font-size:15px; }
  .eyebrow{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--sage); font-weight:600; display:block; margin-bottom:8px; }
  .hint{ font-size:13px; color:#7a7a7a; margin:-4px 0 12px; }

  /* form */
  label.f{ display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:#6b6b6b; margin:20px 0 8px; }
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=search],textarea,select{
    width:100%; padding:14px 14px; border:1px solid var(--beige); border-radius:2px; background:#fff;
    font-family:'Manrope',sans-serif; font-size:16px; /* 16px: evita lo zoom automatico su iOS */ color:var(--charcoal);
    -webkit-appearance:none; appearance:none;
  }
  textarea{ min-height:96px; resize:vertical; line-height:1.5; }
  select{ background-image:linear-gradient(45deg,transparent 50%,var(--taupe) 50%),linear-gradient(135deg,var(--taupe) 50%,transparent 50%); background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%; background-size:6px 6px,6px 6px; background-repeat:no-repeat; padding-right:36px; }
  input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,179,126,.25); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family:'Manrope',sans-serif; font-size:14px; font-weight:500; padding:11px 15px; min-height:44px;
    background:#fff; border:1px solid var(--beige); border-radius:2px; color:var(--charcoal); cursor:pointer; text-align:left;
  }
  .chip.on{ background:var(--charcoal); border-color:var(--charcoal); color:#fff; }

  .btn{
    display:block; width:100%; text-align:center; font-family:'Manrope',sans-serif; font-weight:600; font-size:15px;
    padding:16px 20px; min-height:52px; background:var(--charcoal); color:#fff; border:1px solid var(--charcoal);
    border-radius:2px; cursor:pointer; letter-spacing:.02em; text-decoration:none;
  }
  .btn.ghost{ background:transparent; color:var(--charcoal); }
  .btn.sage{ background:var(--sage); border-color:var(--sage); }
  .btn.sm{ padding:10px 14px; min-height:44px; font-size:14px; width:auto; display:inline-block; }
  .btn[disabled]{ opacity:.5; }
  .stack > * + *{ margin-top:12px; }

  .card{ background:#fff; border:1px solid var(--beige); border-radius:2px; padding:18px; }
  .card + .card{ margin-top:12px; }
  .row{ display:flex; gap:10px; align-items:center; }
  .grow{ flex:1; }
  .muted{ color:#7a7a7a; font-size:13px; }

  /* bottom nav */
  .nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(248,247,244,.97);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border-top:1px solid var(--beige); padding:14px var(--safe-x) var(--safe-bottom);
  }
  .nav-in{ max-width:560px; margin:0 auto; display:flex; gap:10px; }
  .nav .btn{ width:auto; flex:1; }
  .nav .btn.ghost{ flex:0 0 38%; }

  /* lista clienti */
  .client{ display:flex; align-items:center; gap:12px; padding:16px; background:#fff; border:1px solid var(--beige); border-radius:2px; margin-bottom:10px; cursor:pointer; }
  .client .nm{ font-family:'Cormorant Garamond',serif; font-size:22px; line-height:1.15; }
  .client .meta{ font-size:12px; color:#7a7a7a; margin-top:2px; }
  .client .chev{ font-size:26px; color:var(--taupe); padding:0 6px; }
  .client .x{ background:none; border:0; font-size:22px; color:var(--taupe); min-width:44px; min-height:44px; cursor:pointer; }
  .empty{ text-align:center; padding:40px 10px; color:#7a7a7a; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:22px; }

  /* forma viso */
  .faces{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .face{ background:#fff; border:1px solid var(--beige); border-radius:2px; padding:12px 8px 12px; text-align:center; cursor:pointer; font-family:'Manrope',sans-serif; color:var(--charcoal); }
  .face svg{ width:72%; max-width:130px; height:auto; display:block; margin:0 auto 6px; }
  .face .fn{ font-size:14px; font-weight:600; }
  .face.on{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; background:#FBF8F0; }
  .shapeinfo{ border-left:2px solid var(--gold); padding:4px 0 4px 16px; margin:18px 0 6px; font-size:15px; }
  .shapeinfo b{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:500; display:block; }

  /* armocromia */
  .season{ background:var(--tint-sage); border-radius:2px; padding:16px 18px; margin:18px 0 6px; }
  .season b{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:500; display:block; line-height:1.15; }
  .subs{ display:grid; gap:10px; margin-top:12px; }
  .sub{ text-align:left; background:#fff; border:1px solid var(--beige); border-radius:2px; padding:14px 16px; cursor:pointer; font-family:'Manrope',sans-serif; color:var(--charcoal); }
  .sub.on{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; background:#FBF8F0; }
  .sub b{ font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:500; display:block; }
  .sub span{ font-size:13px; color:#6b6b6b; }
  .tag{ display:inline-block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--sage); margin-left:6px; }
  .pal{ display:flex; flex-wrap:wrap; gap:12px 10px; margin:6px 0 14px; }
  .sw{ width:calc(25% - 8px); min-width:64px; text-align:center; font-size:11px; line-height:1.25; color:#555; }
  .sw i{ display:block; height:44px; border-radius:50%; width:44px; margin:0 auto 5px; border:1px solid rgba(0,0,0,.08); }

  /* guida */
  .diagram{ background:#fff; border:1px solid var(--beige); padding:14px; text-align:center; }
  .diagram svg{ width:62%; max-width:260px; height:auto; }
  .legend{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; font-size:12px; color:#555; margin-top:8px; }
  .legend i{ display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-2px; }
  .guide dt{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--sage); margin-top:16px; }
  .guide dd{ font-size:15px; margin-top:3px; }

  /* prova */
  .pstep{ background:#fff; border:1px solid var(--beige); border-radius:2px; padding:14px; margin-bottom:12px; }
  .pstep .head{ display:flex; gap:8px; align-items:center; }
  .pstep .head input{ font-family:'Cormorant Garamond',serif; font-size:22px; padding:8px 4px; border:0; border-bottom:1px solid var(--beige); background:transparent; border-radius:0; }
  .pstep .num{ font-family:'Cormorant Garamond',serif; color:var(--taupe); font-size:20px; min-width:26px; }
  .pstep textarea{ margin-top:8px; min-height:72px; }
  .photos{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .ph{ background:#fff; border:1px solid var(--beige); padding:8px; }
  .ph img{ width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
  .ph select{ margin-top:8px; padding:10px 28px 10px 10px; font-size:15px; }
  .ph .del{ width:100%; margin-top:6px; background:none; border:0; color:#a05050; font:inherit; font-size:13px; min-height:40px; cursor:pointer; }

  /* riepilogo */
  .sum h3{ margin-top:22px; padding-bottom:4px; border-bottom:1px solid var(--gold); display:inline-block; }
  .sum dl{ margin-top:8px; }
  .sum dt{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8a8a8a; font-weight:600; margin-top:10px; }
  .sum dd{ font-size:15px; white-space:pre-wrap; }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--safe-bottom) + 90px); background:var(--charcoal); color:#fff; padding:12px 18px; border-radius:2px; font-size:14px; z-index:50; max-width:90%; }
  /* pannelli (card solo bordo) */
  .panel{ border:1px solid var(--beige); border-radius:2px; padding:22px 18px 8px; margin-top:28px; }
  .panel > h2{ margin:0 0 14px; }
  .panel .fchips{ margin:0 -18px; padding-left:18px; padding-right:18px; }
  .panel .dayhead:first-of-type{ margin-top:14px; }
  .panel .ag,.panel .client{ background:transparent; border:0; border-bottom:1px solid var(--beige); border-radius:0; margin:0; padding:14px 0; }
  .panel .ag:last-child,.panel .client:last-child{ border-bottom:0; }
  .panel .empty{ padding:22px 10px 26px; }
  .linkact{ display:block; width:100%; background:none; border:0; font:600 14px 'Manrope',sans-serif; color:var(--charcoal); text-decoration:underline; text-underline-offset:4px; padding:14px 0 4px; min-height:44px; cursor:pointer; text-align:center; }
  /* agenda / stati */
  .fchips{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; margin:0 calc(var(--safe-x) * -1); padding-left:var(--safe-x); padding-right:var(--safe-x); -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .fchips::-webkit-scrollbar{ display:none; }
  .fchips .chip{ white-space:nowrap; flex:0 0 auto; }
  .sd{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:0; flex:0 0 auto; }
  .chip .cnt{ opacity:.55; margin-left:6px; font-weight:600; }
  .dayhead{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--sage); margin:22px 0 8px; }
  .ag{ display:flex; align-items:center; gap:14px; padding:14px; background:#fff; border:1px solid var(--beige); border-radius:2px; margin-bottom:10px; cursor:pointer; }
  .agd{ flex:0 0 54px; text-align:center; line-height:1.05; }
  .agd b{ display:block; font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:500; }
  .agd span{ display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#7a7a7a; font-weight:600; margin-top:2px; }
  .agd i{ display:block; font-style:normal; font-size:11px; color:var(--sage); margin-top:3px; font-weight:600; }
  .ag .nm,.client .nm{ font-family:'Cormorant Garamond',serif; font-size:22px; line-height:1.15; }
  .ag .meta{ font-size:12px; color:#7a7a7a; margin-top:2px; }
  .st{ display:inline-flex; align-items:center; background:#fff; border:1px solid var(--beige); border-radius:20px; padding:8px 12px; min-height:40px; font:600 12px 'Manrope',sans-serif; color:var(--charcoal); cursor:pointer; white-space:nowrap; }
  .st.big{ font-size:14px; padding:10px 16px; min-height:44px; }
  .ov{ position:fixed; inset:0; background:rgba(43,43,43,.42); z-index:60; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:61; max-width:560px; margin:0 auto; background:var(--warm-white); border-radius:12px 12px 0 0; padding:24px var(--safe-x) var(--safe-bottom); max-height:90vh; max-height:90dvh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.18); }
  .sheet h3{ font-size:26px; margin-bottom:4px; }
  .opt{ display:flex; align-items:center; width:100%; text-align:left; background:#fff; border:1px solid var(--beige); border-radius:2px; padding:15px 16px; min-height:52px; margin-top:8px; font:500 15px 'Manrope',sans-serif; color:var(--charcoal); cursor:pointer; }
  .opt.on{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; background:#FBF8F0; }
  input[type=file]{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  input[type=time],input[type=date]{ min-height:50px; }
  details.how{ background:var(--tint-sage); border-radius:2px; margin:0 0 14px; }
  details.how summary{ list-style:none; cursor:pointer; padding:13px 16px; min-height:44px; font-size:14px; font-weight:600; color:#4f5f52; display:flex; justify-content:space-between; align-items:center; }
  details.how summary::-webkit-details-marker{ display:none; }
  details.how summary::after{ content:'+'; font-size:20px; font-weight:400; }
  details.how[open] summary::after{ content:'–'; }
  details.how .hb{ padding:0 16px 14px; font-size:14px; color:#3f3f3f; }
  details.how .hb p{ margin-top:8px; }
  details.how .hb ul{ margin:8px 0 0 18px; }
  details.how .hb li{ margin-top:6px; }
  details.how .hb b{ font-weight:600; }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" hidden><div class="nav-in" id="navin"></div></nav>
<div id="toast" class="toast" hidden></div>
<div id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  cuore:{n:'A cuore',

/* ====================== STORAGE (IndexedDB, solo sul dispositivo) ====================== */
const mem=new Map(); let dbp=null, useMem=false;
function openDb(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('matea-consulenze',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('schede',{keyPath:'id'});
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }catch(e){rej(e);}
  }).catch(()=>{useMem=true;return null;});
  return dbp;
}
function req(db,mode,fn){return new Promise((res,rej)=>{const t=db.transaction('schede',mode);const o=fn(t.objectStore('schede'));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error);});}
async function dbAll(){const db=await openDb(); if(!db) return [...mem.values()]; return req(db,'readonly',s=>s.getAll());}
async function dbPut(r){const db=await openDb(); if(!db){mem.set(r.id,r);return;} return req(db,'readwrite',s=>s.put(r));}
async function dbDel(id){const db=await openDb(); if(!db){mem.delete(id);return;} return req(db,'readwrite',s=>s.delete(id));}

function daysFrom(iso){return Math.round((new Date(iso+'T12:00:00')-new Date(todayIso()+'T12:00:00'))/864e5);}
function dayHead(iso,month){
  if(!iso) return 'Senza data';
  const d=daysFrom(iso);
  if(!month){ if(d<0) return 'Passati'; if(d===0) return 'Oggi'; if(d===1) return 'Domani'; if(d<=7) return 'Questa settimana'; }
  const m=new Date(iso+'T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'}); return m.charAt(0).toUpperCase()+m.slice(1);
}

function agendaKey(r){ return (agendaDate(r)||'9999-99-99')+(stId(r)==='da-fare'?(r.anag.oraProva||'99:99'):''); }
function agendaHtml(){
  const f=S.filtro; const cnt=id=>S.list.filter(r=>stId(r)===id).length;
  const nAct=S.list.filter(r=>ATTIVI.includes(stId(r))).length;
  const opts=[{id:'attivi',s:'Attivi',c:null,n:nAct},...STATI.map(x=>({id:x.id,s:x.s,c:x.c,n:cnt(x.id)}))];
  const chipsH=`<div class="fchips">${opts.map(o=>`<button type="button" class="chip${f===o.id?' on':''}" data-filtro="${o.id}">${o.c?`<i class="sd" style="background:${o.c}"></i>`:''}${o.s}<span class="cnt">${o.n}</span></button>`).join('')}</div>`;
  const items=S.list.filter(r=>f==='attivi'?ATTIVI.includes(stId(r)):stId(r)===f);
  const desc=(f==='concluso'||f==='annullato');
  items.sort((a,b)=>desc?agendaKey(b).localeCompare(agendaKey(a)):agendaKey(a).localeCompare(agendaKey(b)));
  let last='',body='';
  items.forEach(r=>{
    const iso=agendaDate(r), h=dayHead(iso,desc); if(h!==last){ body+=`<div class="dayhead">${h}</div>`; last=h; }
    const dd=iso?new Date(iso+'T12:00:00'):null;
    const lab=stId(r)==='confermato'?'evento':'prova';
    const when=iso?`<b>${dd.getDate()}</b><span>${dd.toLocaleDateString('it-IT',{month:'short'}).replace('.','')}</span><i>${lab}${stId(r)==='da-fare'&&r.anag.oraProva?' · '+esc(r.anag.oraProva):''}</i>`:`<b>–</b><span>senza data</span>`;

  });
  if(!items.length) body=`<div class="empty" style="padding:26px 10px">${f==='attivi'?'Nessun appuntamento in programma.':'Nessuna scheda in questo stato.'}</div>`;
  return chipsH+body;
}

const HOW={
 prep:['Prima di cominciare: come preparare l\'analisi',`<ul>
  <li><b>Luce naturale</b>, vicino a una finestra, mai luce calda o led colorato.</li>
  <li><b>Viso struccato</b> (o con trucco minimo), capelli raccolti e via dal viso, niente gioielli né occhiali colorati.</li>
  <li>Una <b>mantella o telo bianco</b> sulle spalle, per non farsi influenzare dai vestiti.</li>
  <li>Valutare sempre i <b>colori naturali</b>: capelli tinti o abbronzatura recente falsano il risultato. Guardare radici e sopracciglia.</li>
  <li><b>Ordine</b>: prima sottotono, poi intensità, poi profondità. Ogni risposta si conferma con una prova colori vicino al viso.</li></ul>`],
 sotto:['Come riconoscere il sottotono',`<p>Il sottotono non è il colore della pelle: una pelle chiarissima può essere calda, una scura può essere fredda.</p><ul>
  <li><b>Vene del polso</b> (luce naturale): verdi o olivastre = <b>caldo</b>; blu o viola = <b>freddo</b>; miste o indecise = <b>neutro</b>.</li>
  <li><b>Oro o argento</b> accanto al viso: l'oro illumina = caldo; l'argento illumina = freddo; entrambi vanno bene = neutro.</li>
  <li><b>Telo sotto il mento</b>: bianco puro (ottico) che fa bene = freddo; avorio o panna che fa bene = caldo.</li>
  <li><b>Pesca/corallo oppure rosa/fucsia</b> vicino al viso: il primo valorizza = caldo; il secondo = freddo.</li>
  <li><b>Indizi sul viso</b>: lentiggini color miele o ramate, riflessi dorati nei capelli = caldo. Rossori rosati o bluastri, ombre grigio-blu sotto gli occhi = freddo.</li>
  <li><b>Sole</b> (indicativo): si abbronza dorata = caldo; si arrossa e abbronza poco = freddo.</li>
  <li><b>Neutro</b>: nessun segnale prevale. Scegliere "neutro caldo" o "neutro freddo" in base a quale colore del telo dona di più.</li></ul>
  <p><b>Attenzione:</b> rossori, couperose e abbronzatura ingannano. Il test più affidabile è il telo, confrontando due colori uno dopo l'altro.</p>`],
 croma:['Come riconoscere l\'intensità',`<p>Si valuta il <b>contrasto</b> tra pelle, capelli e occhi, e la <b>limpidezza</b> dei colori.</p><ul>
  <li><b>Brillante</b>: contrasto netto (es. capelli scuri, pelle chiara, occhi vividi). Il bianco dell'occhio è limpido, l'iride ha un colore pulito e acceso. I colori puri e saturi (rosso, turchese, fucsia) stanno bene.</li>
  <li><b>Morbido</b>: poco contrasto, tutto sulla stessa tonalità, sfumato. Occhi con colori misti e "polverosi" (nocciola, verde-grigio, castano). I colori attenuati (salvia, malva, cammello) stanno meglio.</li>
  <li><b>Test del colore vivo</b>: avvicinare al viso un rosso o un fucsia puro. Se il colore "vince" sul viso e la persona sembra sparire = <b>morbido</b>. Se il viso si accende = <b>brillante</b>.</li></ul>`],
 prof:['Come riconoscere la profondità',`<p>Si guarda l'<b>insieme</b> di capelli naturali, occhi e pelle, non la sola pelle.</p><ul>
  <li><b>Chiaro</b>: capelli biondi o castano chiaro, occhi chiari, pelle chiara. I colori scuri e pesanti "schiacciano" il viso.</li>
  <li><b>Scuro</b>: capelli castano scuro o neri, occhi scuri, pelle da media a scura. I colori troppo pallidi la "spengono".</li>
  <li><b>Medio</b>: via di mezzo, nessuno dei due estremi prevale.</li>
  <li><b>Trucco utile</b>: una foto in bianco e nero del viso mostra subito se l'insieme è chiaro, medio o scuro.</li></ul>`],
 sub:['Come scegliere la sottostagione',`<p>Ogni stagione ha <b>3 sottostagioni</b>: non esistono tutte e 5 le caratteristiche in ogni stagione. Si sceglie quella legata al <b>tratto dominante</b>, cioè la prima cosa che si nota della persona.</p><ul>
  <li><b>Primavera</b>: <b>chiara</b> (domina la luminosità) · <b>calda</b> (domina il calore dorato) · <b>brillante</b> (domina il contrasto vivo).</li>
  <li><b>Estate</b>: <b>chiara</b> (luminosità delicata) · <b>fredda</b> (domina il sottotono freddo) · <b>morbida</b> (poco contrasto, tutto sfumato).</li>
  <li><b>Autunno</b>: <b>morbido</b> (caldo ma attenuato) · <b>caldo</b> (domina il calore intenso) · <b>profondo</b> (domina la scurezza).</li>
  <li><b>Inverno</b>: <b>profondo</b> (domina la scurezza) · <b>freddo</b> (domina il sottotono freddo netto) · <b>brillante</b> (contrasto altissimo).</li></ul>
  <p><b>Verifica sul viso</b>: provare due o tre rossetti o blush della palette. Quello giusto uniforma la pelle, attenua ombre e occhiaie e rende gli occhi luminosi. Quello sbagliato ingiallisce o ingrigisce, evidenzia rossori e occhiaie, e il colore si vede più del viso.</p>
  <p><b>Se sei indecisa</b>: provare la sottostagione vicina della stessa stagione e tenere quella che regge meglio il test.</p>`]
};

async function saveNuovo(){
  const n=S.nuovo;
  if(!n.nome.trim()&&!n.cognome.trim()){ toast('Inserisci almeno nome o cognome'); return; }
  if(!n.dataProva){ toast('Inserisci il giorno della prova'); return; }
  const r=newRec();
  Object.assign(r.anag,{nome:n.nome.trim(),cognome:n.cognome.trim(),tel:n.tel.trim(),email:n.email.trim(),occasione:n.occasione,dataProva:n.dataProva,oraProva:n.oraProva,dataEvento:n.dataEvento});
  r.stato='da-fare'; r.step=0;
  await dbPut(r); S.list=await dbAll(); closeSheet(); render(true); toast('Appuntamento salvato');
}

document.addEventListener('click',async e=>{

  if(t.dataset.setstato){ const r=recById(S.sheet.id); r.stato=t.dataset.setstato; r.updated=Date.now(); await dbPut(r); S.sheet=null; renderSheet(); render(true); return; }
  if(t.dataset.pay){ const r=recById(S.sheet.id); r.pag=r.pag||{}; r.pag[t.dataset.pay]=!r.pag[t.dataset.pay]; r.updated=Date.now(); await dbPut(r); renderSheet(); return; }
  if(t.dataset.nbchip){ S.nuovo.occasione=S.nuovo.occasione===t.dataset.nbchip?'':t.dataset.nbchip; renderSheet(); return; }
  if(t.dataset.chip){
    const path=t.dataset.chip,val=t.dataset.val;
    if(t.hasAttribute('data-multi')){ const a=getp(S.rec,path)||[]; const i=a.indexOf(val); i>=0?a.splice(i,1):a.push(val); setp(S.rec,path,a); }
    else setp(S.rec,path,getp(S.rec,path)===val?'':val);
    if(path==='colori.sottotono'||path==='colori.croma'){ S.rec.colori.sub=''; }
    touch(); render(true); return;
  }
  if(t.dataset.open){ S.rec=S.list.find(r=>r.id===t.dataset.open); S.step=Math.min(S.rec.step||0,STEPS.length-1); render(); return; }
  if(t.dataset.goto){ go(+t.dataset.goto); return; }
  if(t.dataset.sdel){ S.rec.prova.steps=S.rec.prova.steps.filter(s=>s.id!==t.dataset.sdel); touch(); render(true); return; }
  if(t.dataset.pdel){ S.rec.photos=S.rec.photos.filter(f=>f.id!==t.dataset.pdel); touch(); render(true); return; }
  switch(t.dataset.act){
    case 'new': S.rec=newRec(); S.step=0; await saveNow(); render(); break;
    case 'newappt': S.nuovo={nome:'',cognome:'',tel:'',email:'',occasione:'',dataProva:'',oraProva:'',dataEvento:''}; S.sheet={type:'nuovo'}; renderSheet(); break;
    case 'savenew': saveNuovo(); break;
    case 'sheetclose': closeSheet(); break;
    case 'close': if(stId(S.rec)==='da-fare'){ S.sheet={type:'chiudi'}; renderSheet(); } else home(); break;
    case 'closeyes': S.rec.stato='attesa'; await saveNow(); closeSheet(); home(); break;
    case 'closeno': closeSheet(); home(); break;
    case 'home': home(); break;
    case 'next': go(S.step+1); break;
    case 'prev': go(S.step-1); break;
    case 'addstep': S.rec.prova.steps.push({id:uid(),nome:'',note:''}); touch(); render(true); setTimeout(()=>{const i=document.querySelectorAll('.pstep input');i[i.length-1]&&i[i.length-1].focus();},50); break;
    case 'pdf': makePdf(t); break;
    case 'share': sharePdf(); break;
  }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset&&d.dataset.how) S.open[d.dataset.how]=d.open; },true);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.nb){ S.nuovo[t.dataset.nb]=t.value; }
  else if(t.dataset.bind){ setp(S.rec,t.dataset.bind,t.value); touch(); }
  else if(t.dataset.step){ const s=S.rec.prova.steps.find(x=>x.id===t.dataset.step); if(s){ s[t.dataset.k]=t.value; touch(); } }
  else if(t.id==='search'){ S.q=t.value; $('#clist').innerHTML=homeList(); }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.plabel){ const f=S.rec.photos.find(x=>x.id===t.dataset.plabel); if(f){f.label=t.value; touch();} }
  else if(t.classList.contains('phin')){ const files=[...t.files]; t.value=''; if(!files.length) return; let ok=0; for(const f of files){ try{ S.rec.photos.push({id:uid(),label:'Prova',data:await shrink(f)}); ok++; }catch(_){ toast('Foto non leggibile (formato non supportato?)'); } } if(ok){ touch(); await saveNow(); render(true); toast(ok+(ok>1?' foto aggiunte':' foto aggiunta')); } }
});

/* ---------- foto: ridimensiona per risparmiare spazio ---------- */
function shrink(file,max=1600,q=.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
    im.onerror=()=>{URL.revokeObjectURL(url);rej();}; im.src=url;
  });
}

/* ---------- salvataggio file (PDF) ---------- */
async function shareOrSave(blob,name,title){
  try{ const dl=window.claude&&window.claude.use&&await window.claude.use('downloads'); if(dl){ await dl.save({filename:name,data:blob}); return; } }catch(e){ if(e&&e.code==='declined') return; }
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

/* ====================== PDF ====================== */
const lat=s=>String(s==null?'':s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x09\x0A\x20-\x7E -ÿ]/g,'');
function svgPng(svg,w,h){
  return new Promise((res,rej)=>{
    const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#F8F7F4'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); res(c.toDataURL('image/png')); };
    im.onerror=rej; im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function imgSize(src){return new Promise(r=>{const i=new Image();i.onload=()=>r([i.naturalWidth,i.naturalHeight]);i.onerror=()=>r([3,4]);i.src=src;});}
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

async function buildPdf(r){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=20,CW=W-2*M; let y=M+4;
  const CH=[43,43,43],GOLD=[201,179,126],TAUPE=[150,138,126],SAGE=[138,155,140];
  const bg=()=>{doc.setFillColor(248,247,244);doc.rect(0,0,W,H,'F');};
  const np=()=>{doc.addPage();bg();y=M+4;};
  const ensure=h=>{if(y+h>H-M-8) np();};
  bg();
  const a=r.anag,v=r.viso,c=r.colori,s=r.asp,p=r.prova,d=c.sub&&SD[c.sub];

  // intestazione
  doc.setTextColor(...CH); doc.setFont('times','normal'); doc.setFontSize(24); doc.text('MATÉA',M,y+4,{charSpace:2.4});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...SAGE); doc.text('SKINCARE STUDIO  ·  CONSULENZA TRUCCO',M,y+10,{charSpace:.8});
  y+=17; doc.setDrawColor(...GOLD); doc.setLineWidth(.4); doc.line(M,y,W-M,y); y+=12;
  doc.setTextColor(...CH); doc.setFont('times','normal'); doc.setFontSize(26); doc.text(lat(fullName(r)),M,y); y+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...TAUPE);
  doc.text(lat('Giorno della prova trucco: '+provaDay(r)),M,y); y+=10;

  const section=t=>{ ensure(22); y+=6; doc.setFont('times','normal'); doc.setFontSize(16); doc.setTextColor(...CH); doc.text(lat(t),M,y); y+=2.5; doc.setDrawColor(...GOLD); doc.setLineWidth(.35); doc.line(M,y,M+14,y); y+=6; };
  const kv=(k,val)=>{ val=listVal(val); if(!String(val).trim()) return;
    const lines=doc.splitTextToSize(lat(val),CW); ensure(8+lines.length*4.6);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...TAUPE); doc.text(lat(k).toUpperCase(),M,y,{charSpace:.6}); y+=4.2;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...CH); doc.text(lines,M,y); y+=lines.length*4.6+2.6; };
  const sw=(label,arr)=>{ if(!arr||!arr.length) return; ensure(24);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...TAUPE); doc.text(label.toUpperCase(),M,y,{charSpace:.6}); y+=3.5;
    arr.forEach(([n,h],i)=>{ const x=M+i*40; doc.setFillColor(...hex2rgb(h)); doc.setDrawColor(225,220,212); doc.setLineWidth(.2); doc.circle(x+5,y+5,5,'FD');
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...CH); doc.text(doc.splitTextToSize(lat(n),26),x+12,y+5.6); });
    y+=14; };

  /* ---------- PAGINA 1: anagrafica + viso (2 colonne), poi armocromia ---------- */
  const CWc=(CW-10)/2, X2=M+CWc+10, g3=(CW-16)/3;
  const titleAt=(x,yy,t)=>{ doc.setFont('times','normal'); doc.setFontSize(16); doc.setTextColor(...CH); doc.text(lat(t),x,yy); doc.setDrawColor(...GOLD); doc.setLineWidth(.35); doc.line(x,yy+2.5,x+14,yy+2.5); return yy+9; };
  const itemsAt=(x,w,yy,items)=>{ items.forEach(([k,val])=>{ val=listVal(val); if(!String(val).trim()) return;
    const L=doc.splitTextToSize(lat(val),w); doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...TAUPE); doc.text(lat(k).toUpperCase(),x,yy,{charSpace:.6}); yy+=4.2;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...CH); doc.text(L,x,yy); yy+=L.length*4.6+2.6; }); return yy; };

  let ya=titleAt(M,y+4,'Anagrafica'), yb=titleAt(X2,y+4,'Viso');
  ya=itemsAt(M,CWc,ya,[['Tipo evento',a.occasione],['Email',a.email],['Telefono',a.tel],[a.occasione==='Sposa'?'Data nozze':'Data',fmtIso(a.dataEvento)],['Luogo del trucco',a.luogo],['Orario',orario(a)],['Note',a.note]]);
  yb=itemsAt(X2,CWc,yb,[['Forma del viso',v.forma&&FACES[v.forma].n],['Tipo di pelle',v.pelle],['Forma degli occhi',v.occhi],['Labbra',v.labbra],['Note',v.note]]);
  y=Math.max(ya,yb)+2;

  doc.setDrawColor(225,220,212); doc.setLineWidth(.3); doc.line(M,y,W-M,y); y+=9;
  y=titleAt(M,y,'Armocromia');
  const arr=[['Sottotono',c.sottotono],['Intensita',c.croma],['Profondita',c.profondita],['Capelli',c.capelli],['Occhi',c.occhiCol],['Stagione',c.sub&&subName(c.sub)]];
  for(let row=0;row<2;row++){ let ym=y; for(let i=0;i<3;i++){ const yy=itemsAt(M+i*(g3+8),g3,y,[arr[row*3+i]]); ym=Math.max(ym,yy); } y=ym; }
  if(d){
    y+=1; doc.setFont('times','italic'); doc.setFontSize(12); doc.setTextColor(...CH);
    const L=doc.splitTextToSize(lat(d.d+' Metalli: '+d.m+'.'),CW); doc.text(L,M,y); y+=L.length*5+4;
    [['Occhi',d.occhi],['Labbra',d.labbra],['Blush',d.blush]].forEach(([lab,list],i)=>{
      const x=M+i*(g3+8); let yy=y;
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...TAUPE); doc.text(lab.toUpperCase(),x,yy,{charSpace:.6}); yy+=4;
      list.forEach(([n,h])=>{ doc.setFillColor(...hex2rgb(h)); doc.setDrawColor(225,220,212); doc.setLineWidth(.2); doc.circle(x+5.5,yy+5.5,5.5,'FD');
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...CH); doc.text(doc.splitTextToSize(lat(n),g3-15),x+14,yy+6.2); yy+=13; });
    });
    y+=4+13*3;
  }
  kv('Note armocromia',c.note);

  /* ---------- PAGINA 2: aspettative + linee guida ---------- */
  np();
  y=titleAt(M,y+4,'Aspettative');
  let yl=itemsAt(M,CWc,y,[['Stile',s.stili],['Finish',s.finish],['Intensita occhi',s.occhi],['Labbra',s.labbra],['Resistenza',s.resa]]);
  let yr=itemsAt(X2,CWc,y,[['Riferimenti',s.rif],['Da evitare',s.evitare],['Allergie',s.allergie]]);
  y=Math.max(yl,yr)+2;

  if(v.forma){
    const f=FACES[v.forma]; section('Linee guida - viso '+f.n.toLowerCase());
    try{
      const png=await svgPng(faceSvg(v.forma,true,'width="620" height="769"'),620,769);
      ensure(72); const ih=66,iw=ih*620/769; doc.addImage(png,'PNG',M,y,iw,ih);
      const tx=M+iw+8, tw=W-M-tx; let ty=y+3; const g=f.g;
      [['Obiettivo',g.obiettivo],['Contouring',g.contouring],['Blush',g.blush],['Punti luce',g.luce]].forEach(([k,t])=>{
        const L=doc.splitTextToSize(lat(t),tw); doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...TAUPE); doc.text(k.toUpperCase(),tx,ty,{charSpace:.6}); ty+=4;
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...CH); doc.text(L,tx,ty); ty+=L.length*4.1+3; });
      y+=ih+6;
    }catch(_){ }
  }

  const steps=p.steps.filter(x=>x.note.trim());
  if(steps.length||p.note||p.giorno){
    section('Prova trucco');
    steps.forEach((x,i)=>kv((i+1)+'. '+x.nome,x.note));
    kv('Note della prova',p.note); kv('Da modificare per il giorno',p.giorno);
  }

  if(r.photos.length){
    if(y>H-M-160) np();
    section('Foto della prova');
    const gw=(CW-8)/2; let col=0, rowH=0, ry=y;
    for(const f of r.photos){
      const [iw,ih]=await imgSize(f.data); let w=gw,h=gw*ih/iw; if(h>110){h=110;w=h*iw/ih;}
      if(col===0){ ensure(h+12); ry=y; rowH=0; }
      else if(ry+h+12>H-M-8){ np(); col=0; ry=y; rowH=0; }
      const x=M+col*(gw+8);
      doc.addImage(f.data,'JPEG',x,ry,w,h); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...TAUPE); doc.text(lat(f.label),x,ry+h+4.5);
      rowH=Math.max(rowH,h+9);
      if(col===1){ y=ry+rowH; col=0; } else col=1;
    }
    if(col===1) y=ry+rowH;
  }

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...TAUPE);
    doc.text('Matea Skincare Studio  -  Consulenza trucco',M,H-12); doc.text(i+' / '+n,W-M,H-12,{align:'right'}); }
  return doc.output('blob');
}

async function makePdf(btn){
  if(!window.jspdf){ toast('Libreria PDF non caricata: controlla la connessione'); return; }
  const old=btn.textContent; btn.disabled=true; btn.textContent='Creo il PDF…';
  try{
    await saveNow();
    const blob=await buildPdf(S.rec);
    if(S.pdf) URL.revokeObjectURL(S.pdf.url);
    const nm='consulenza-'+(fullName(S.rec).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cliente')+'.pdf';
    S.pdf={id:S.rec.id,blob,name:nm,url:URL.createObjectURL(blob)};
    const box=$('#pdfbox'); if(box){ box.innerHTML=pdfButtons(); box.scrollIntoView({behavior:'smooth',block:'center'}); }
  }catch(e){ console.error(e); toast('Errore nella creazione del PDF'); }
  btn.disabled=false; btn.textContent=old;
}
function sharePdf(){ if(S.pdf) shareOrSave(S.pdf.blob,S.pdf.name,'Consulenza trucco'); }

  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(_){}
  S.list=await dbAll(); render();
  if(useMem) toast('Memoria del browser non disponibile: le schede non verranno salvate');
})();
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveNow(); });
})();
